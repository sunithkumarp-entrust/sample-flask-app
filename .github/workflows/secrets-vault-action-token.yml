name: Test PASM Vault Action Token Auth

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/secrets-vault-action-token.yml'

jobs:
  test-vault-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Fetch secret from PASM vault
        id: fetch-secret
        uses: EntrustCorporation/secrets-vault-action@main
        with:
          base_url: ${{ secrets.BASE_URL }}
          api_token: ${{ secrets.API_TOKEN }}
          box_id: ${{ secrets.BOX_ID }}
          secret_id: ${{ secrets.SECRET_ID }}
          ca_cert: ${{ secrets.CA_CERT }}
          secrets: |
            secret.Box1.DOCKER_USERNAME | DOCKER_USERNAME;
            secret.Box1.DOCKER_PASSWORD | DOCKER_PASSWORD;

      - name: Verify secret was retrieved
        run: |
          echo "Secret was successfully retrieved: ${{ steps.fetch-secret.outputs.secret != '' }}"
          
      - name: Display the secret (for testing only)
        if: steps.fetch-secret.outputs.DOCKER_USERNAME != ''
        run: |
          # Display the actual secret for testing purposes
          echo "Retrieved secret value: ${{ steps.fetch-secret.outputs.DOCKER_USERNAME }}"
          SECRET_LENGTH=$(echo "${{ steps.fetch-secret.outputs.DOCKER_USERNAME }}" | wc -c)
          echo "Secret length: $SECRET_LENGTH characters"
