name: Docker Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Ensure Python 3 is installed
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip

    - name: Fetch secret from external vault
      id: fetch-secret
      uses: ./.github/actions/fetch_secret
      with:
        base-url: ${{ secrets.BASEURL }}
        api-token: ${{ secrets.API_TOKEN }}
        box-id: ${{ secrets.BOX_ID }}
        secret-id: ${{ secrets.SECRET_ID }}
        ca-cert: ${{ secrets.CA_CERT }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-flask-app:latest
        build-args: |
          EXTERNAL_SECRET=${{ steps.fetch-secret.outputs.secret }}
