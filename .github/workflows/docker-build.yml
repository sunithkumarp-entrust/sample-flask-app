name: Docker Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Fetch secret from external vault
      id: fetch-secret
      uses: ./.github/actions/fetch_secret
      with:
        base_url: ${{ secrets.BASE_URL }}
        api_token: ${{ secrets.API_TOKEN }}
        box_id: ${{ secrets.BOX_ID }}
        secret_id: ${{ secrets.SECRET_ID }}
        ca_cert: ${{ secrets.CA_CERT }}
        
    - name: Verify secret was fetched
      run: |
        echo "Secret output exists: ${{ steps.fetch-secret.outputs.secret != '' }}"
        # Don't print the actual secret value for security reasons

    - name: Log in to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-flask-app:latest
        build-args: |
          EXTERNAL_SECRET=${{ steps.fetch-secret.outputs.secret }}
