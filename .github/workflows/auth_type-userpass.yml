name: Test Secret Vault Action with UserPass Auth

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/auth_type-userpass.yml'

jobs:
  test-vault-userpass-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      # Debug step to check if secrets exist (without exposing values)
      - name: Debug - Check Secrets Availability
        run: |
          echo "VAULT_USERNAME secret exists: ${{ secrets.VAULT_USERNAME != '' }}"
          echo "VAULT_PASSWORD secret exists: ${{ secrets.VAULT_PASSWORD != '' }}"
          echo "Other required secrets exist: ${{ secrets.BASE_URL != '' && secrets.VAULT_UID != '' && secrets.BOX_ID != '' && secrets.SECRET_ID != '' }}"
      
      - name: Fetch secret using username/password authentication
        id: fetch-secret
        uses: EntrustCorporation/secrets-vault-action@main
        with:
          base_url: ${{ secrets.BASE_URL }}
          auth_type: 'userpass'
          username: ${{ secrets.VAULT_USERNAME }}
          password: ${{ secrets.VAULT_PASSWORD }}
          vault_uid: ${{ secrets.VAULT_UID }}
          ca_cert: ${{ secrets.CA_CERT }}
          secrets: |
            secret.Box1.accessKey | AWS_ACCESS_KEY_ID;
            secret.Box1.SimpleKVSecret | SIMPLE_KV_SECRET;
            secret.Box1.ExampleTextSecret | EXAMPLE_TEXT_SECRET;
            secret.Box2.StripeKey | STRIPE_KEY;
            secret.Box1.DOCKER_USERNAME | DOCKER_USERNAME;
            secret.Box1.DOCKER_PASSWORD | DOCKER_PASSWORD;
        # Set continue-on-error to true to allow the workflow to proceed even if this step fails
        continue-on-error: true
          
      - name: Verify secret was retrieved
        if: steps.fetch-secret.outcome == 'success'
        run: |
          echo "Secret was successfully retrieved"

      - name: Display the secret (for testing only)
        if: steps.fetch-secret.outcome == 'success'
        run: |
          # Display the actual secret for testing purposes

          echo "Retrieved AWS_ACCESS_KEY_ID: ${{ steps.fetch-secret.outputs.AWS_ACCESS_KEY_ID }}"
          echo "Retrieved SIMPLE_KV_SECRET: ${{ steps.fetch-secret.outputs.SIMPLE_KV_SECRET }}"
          echo "Retrieved EXAMPLE_TEXT_SECRET: ${{ steps.fetch-secret.outputs.EXAMPLE_TEXT_SECRET }}"
          echo "Retrieved STRIPE_KEY: ${{ steps.fetch-secret.outputs.STRIPE_KEY }}"
          echo "Retrieved DOCKER_USERNAME: ${{ steps.fetch-secret.outputs.DOCKER_USERNAME }}"
          echo "Retrieved DOCKER_PASSWORD: ${{ steps.fetch-secret.outputs.DOCKER_PASSWORD }}"
          
          echo "Retrieved AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}"
          echo "Retrieved SIMPLE_KV_SECRET: ${SIMPLE_KV_SECRET}"
          echo "Retrieved EXAMPLE_TEXT_SECRET: ${EXAMPLE_TEXT_SECRET}"
          echo "Retrieved STRIPE_KEY: ${STRIPE_KEY}"
          echo "Retrieved DOCKER_USERNAME: ${DOCKER_USERNAME}"
          echo "Retrieved DOCKER_PASSWORD: ${DOCKER_PASSWORD}"

          echo '${{ toJson(steps.fetch-secret.outputs) }}'
        
      # Login to docker hub to push docker image
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${DOCKER_USERNAME}
          password: ${DOCKER_PASSWORD}

      # Build the actual application using secrets fetched from vault
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.AWS_ACCESS_KEY_ID }}/my-flask-app:latest
          build-args: |
            EXTERNAL_SECRET=${{ steps.fetch-secret.outputs.AWS_ACCESS_KEY_ID }}