name: 'Fetch Secret'
description: 'Fetch a secret from an external vault'
inputs:
  api-url:
    description: 'The URL of the API to fetch the secret from'
    required: true
  api-token:
    description: 'The API token for authentication'
    required: true
  box-id:
    description: 'The box ID to fetch the secret from'
    required: true
  secret-id:
    description: 'The secret ID to fetch'
    required: true
  ca-cert:
    description: 'The CA certificate for SSL verification'
    required: false
outputs:
  secret:
    description: 'The fetched secret'
runs:
  using: 'python3'
  main: 'main.py'
branding:
  color: 'blue'
  icon: 'lock'
